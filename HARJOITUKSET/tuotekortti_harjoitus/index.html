<!DOCTYPE html>
<html lang="fi">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title> Tuotekortti | harjoitus </title>
   </head>

   <body>
    <button
        id="tuotekortti"
        data-tuotteen-nimi="Kirja"
        data-hinta="49.99"
        data-varastossa="true"
        onclick="näytäTuotekortti()">
        Näytä tuotekortti
    </button>
    <script>
        function näytäTuotekortti() {
            const button = document.querySelector("#tuotekortti"); 
            console.log("Tuotteen nimi: " + button.dataset.tuotteenNimi);
            console.log("Hinta: " + button.dataset.hinta);
            console.log("Varastossa: " + button.dataset.varastossa);
        }
    </script>
   </body>
</html>
